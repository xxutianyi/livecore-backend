# docker/supervisord.conf
[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

# ==================== FrankenPHP 主服务 ====================
[program:octane]
command=/usr/local/bin/frankenphp php-cli artisan octane:frankenphp --host=0.0.0.0
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
priority=1

# ==================== Reverb 实时服务 ====================
[program:reverb]
command=/usr/local/bin/frankenphp php-cli artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
priority=2

# ==================== Queue 队列工作进程 ====================
[program:queue]
command=./frankenphp php-cli artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
priority=3

# ==================== Scheduler 定时任务 ====================
[program:scheduler]
command=/usr/local/bin/frankenphp php-cli artisan schedule:work
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
priority=4
